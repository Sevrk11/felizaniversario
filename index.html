<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversario, Mi Amor AlexDev</title>

  
  <style>
    :root{
      --paper-1:   #fff0f5; 
      --paper-2:   #ffe4e8;
      --paper-3:   #ffccd5;
      --ink:       #4a1525; 
      --ink-soft:  #8a3a52;
      --oxblood:   #c9184a; 
      --oxblood-d: #a4133c;
      --brass:     #ff8fa3; 
      --brass-d:   #ff758f;
      --gold:      #ffb3c1;
      --olive:     #c9184a; 
      --leather-1: #590d22; 
      --leather-2: #3f0918;
      --leather-3: #2b040e;
      --line:      rgba(201, 24, 74, .28);
      --line-soft: rgba(201, 24, 74, .16);

      --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      --mono:  ui-monospace, 'Courier New', 'Courier', monospace;
      --radius: 5px;
    }

    *{ box-sizing:border-box; 
      cursor: url('love.png'), auto !important;
}
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--serif);
      color:var(--ink);
      background: radial-gradient(120% 90% at 50% 0%, #2b040e 0%, #170207 55%, #0a0103 100%);
      min-height:100dvh;
      display:flex; flex-direction:column; align-items:center;
      padding:22px 14px 44px; gap:20px;
      -webkit-font-smoothing:antialiased;
    }

    .toolbar{
      width:min(760px,100%);
      display:flex; flex-direction:column; align-items:center; gap:12px;
      padding:12px 16px; color:#ffccd5;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.12));
      border:1px solid rgba(255,179,193,.18); border-radius:8px;
      backdrop-filter:blur(2px);
    }
    .toolbar .brand{ font-size:1rem; letter-spacing:.22em; text-transform:uppercase; color:#ffb3c1; }
    .toolbar .brand b{ color:#fff0f5; font-weight:600; letter-spacing:.14em; }
    .controls{ display:flex; align-items:center; justify-content:center; column-gap:36px; row-gap:12px; flex-wrap:wrap; }
    .ctl{ display:flex; align-items:center; gap:10px; font-size:1.1rem; }
    .ctl label{ color:#ffe4e8; }
    
    input[type=range].range{ -webkit-appearance:none; appearance:none; width:120px; height:6px; border-radius:3px; background:#8a3a52; cursor:pointer; }
    input[type=range].range::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#ffe4e8; border:2px solid var(--brass-d); cursor:pointer; }
    input[type=range].range::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:#ffe4e8; border:2px solid var(--brass-d); cursor:pointer; }
    .ctl .val{ font-family:var(--mono); font-size:1rem; color:#ffb3c1; min-width:4.2ch; text-align:right; }

    .stage{ width:min(880px,100%); display:flex; justify-content:center; filter:drop-shadow(0 30px 45px rgba(0,0,0,.5)); margin-top:6px; }
    .warp{ perspective:2400px; width:100%; aspect-ratio:16 / 11; max-height:72dvh; }
    .warp.curved{ filter:url(#book-curve); }
    .book{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transform:translateX(0) rotateY(0deg); transition:transform .95s cubic-bezier(.6,.05,.3,1); --tL:0px; --tR:24px; }
    .book.closed-front{ transform:translateX(-25%) rotateY(20deg); }
    .book.closed-back { transform:translateX(25%)  rotateY(-20deg); }
    #leaves{ position:absolute; inset:0; transform-style:preserve-3d; }

    .paper{ position:absolute; top:0; left:50%; width:50%; height:100%; transform-origin:left center; transform-style:preserve-3d; transform:rotateY(0deg) translateZ(var(--tz,0px)); transition:transform .85s cubic-bezier(.5,.05,.25,1); }
    .paper.flipped{ transform:rotateY(-180deg) translateZ(var(--tz,0px)); }
    .face{ position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; overflow:hidden; }
    .face.front{ border-radius:2px 6px 6px 2px; background:linear-gradient(90deg, #ffc2d1 0%, #ffccd5 2%, #fff5f7 6.5%, #ffe4e8 11%, var(--paper-1) 20%, var(--paper-1) 100%); box-shadow:inset 14px 0 22px -14px rgba(74,21,37,.4); }
    .face.back{ transform:rotateY(180deg); border-radius:6px 2px 2px 6px; background:linear-gradient(270deg, #ffc2d1 0%, #ffccd5 2%, #fff5f7 6.5%, #ffe4e8 11%, var(--paper-1) 20%, var(--paper-1) 100%); box-shadow:inset -14px 0 22px -14px rgba(74,21,37,.4); }
    .paper.cover .face.front{ border-radius:4px 10px 10px 4px; }
    .paper.cover .face.back { border-radius:10px 4px 4px 10px; }
    .face::after{ content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,.15), rgba(0,0,0,0) 40%); opacity:0; transition:opacity .85s; }
    .face.back::after{ background:linear-gradient(270deg, rgba(0,0,0,.15), rgba(0,0,0,0) 40%); }
    .paper.turning .face::after{ opacity:1; }
    .gutter{ position:absolute; top:0; left:calc(50% - 26px); width:52px; height:100%; background:linear-gradient(90deg, transparent, rgba(201,24,74,.15) 34%, rgba(89,13,34,.35) 50%, rgba(201,24,74,.15) 66%, transparent); pointer-events:none; z-index:60; transition:opacity .5s; }
    .book.is-closed .gutter{ opacity:0; }

    .spine3d{ position:absolute; top:0; height:100%; left:50%; width:44px; transform-origin:left center; transform:rotateY(90deg); transform-style:preserve-3d; pointer-events:none; }
    .sface{ position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; background: repeating-linear-gradient(180deg, transparent 0 44px, rgba(0,0,0,.4) 44px 47px, rgba(255,255,255,.14) 47px 49px, transparent 49px 62px), linear-gradient(90deg, #1f030a, var(--leather-2) 20%, var(--leather-1) 50%, var(--leather-2) 80%, #1f030a), var(--leather-3); display:flex; align-items:center; justify-content:center; border-radius:3px; }
    .sface.rev{ transform:rotateY(180deg); }
    .sface .stitle{ writing-mode:vertical-rl; font-size:.65rem; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); text-shadow:0 1px 0 rgba(0,0,0,.8); background:rgba(0,0,0,.18); padding:10px 3px; border-radius:2px; }

    .edge{ position:absolute; top:100%; pointer-events:none; z-index:1; background: linear-gradient(180deg, rgba(201,24,74,.20), rgba(201,24,74,.05) 30%, rgba(0,0,0,.25) 100%), repeating-linear-gradient(180deg, #fff0f5 0 1px, #ffccd5 1px 2.6px); transition:height .8s cubic-bezier(.5,.05,.25,1); }
    .edge.l{ left:0; width:50%; height:var(--tL); clip-path:polygon(0 0, 100% 0, calc(100% - 8px) 100%, var(--tL) 100%); }
    .edge.r{ left:50%; width:50%; height:var(--tR); clip-path:polygon(0 0, 100% 0, calc(100% - var(--tR)) 100%, 8px 100%); }

    .page{ position:absolute; inset:0; padding:clamp(20px, 3vw, 36px); display:flex; flex-direction:column; overflow:auto; background-image: repeating-linear-gradient(0deg, rgba(201,24,74,.015) 0 2px, transparent 2px 4px), radial-gradient(80% 60% at 20% 10%, rgba(255,255,255,.4), transparent 60%); }
    .page::-webkit-scrollbar{ width:10px; }
    .page::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

    .corner{ position:absolute; bottom:0; width:64px; height:64px; cursor:pointer; z-index:50; background:linear-gradient(135deg, transparent 50%, rgba(201,24,74,.08) 50%); opacity:.55; transition:opacity .2s; }
    .corner:hover{ opacity:1; }
    .corner.next{ right:0; }
    .corner.prev{ left:0; transform:scaleX(-1); }

    .eyebrow{ font-size:0.9rem; letter-spacing:.28em; text-transform:uppercase; color:var(--brass-d); margin:0 0 10px; font-weight:bold;}
    h1.title{ font-size:clamp(1.8rem,4vw,2.5rem); line-height:1.1; margin:0 0 8px; font-weight:700; color:var(--oxblood-d); }
    h2.head{ font-size:clamp(1.4rem,3vw,1.8rem); margin:0 0 6px; font-weight:700; color:var(--oxblood-d); }
    .rule{ height:0; border:0; border-top:1.5px solid var(--line); margin:16px 0; position:relative; }
    .rule.orn::after{ content:"♥"; position:absolute; left:50%; top:-12px; transform:translateX(-50%); background:var(--paper-1); color:var(--brass-d); padding:0 10px; font-size:1.1rem; }
    .lead{ font-size:1.1rem; line-height:1.6; color:var(--ink-soft); margin:0 0 14px; }
    .pagefoot{ margin-top:auto; padding-top:14px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.9rem; color:var(--ink-soft); }

    .index{ list-style:none; padding:0; margin:20px 0 0; }
    .index li{ display:flex; align-items:baseline; gap:10px; padding:10px 0; border-bottom:1.5px dotted var(--line-soft); font-size:1.1rem; }
    .index .num{ font-family:var(--mono); color:var(--brass-d); width:3ch; font-weight:bold;}
    .index .dots{ flex:1; border-bottom:1.5px dotted var(--line); transform:translateY(-4px); }
    .index .pg{ font-family:var(--mono); color:var(--ink-soft); font-weight:bold;}

    .leather{ position:absolute; inset:0; background: repeating-linear-gradient(115deg, rgba(0,0,0,.15) 0 2px, transparent 2px 5px), radial-gradient(120% 100% at 30% 20%, var(--leather-1), var(--leather-2) 60%, var(--leather-3)); display:flex; align-items:center; justify-content:center; padding:clamp(20px,4vw,40px); }
    .leather .frame{ width:100%; height:100%; border:3px solid rgba(255,179,193,.45); outline:1.5px solid rgba(255,179,193,.20); outline-offset:-12px; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; }
    .leather .over{ font-size:0.9rem; letter-spacing:.34em; text-transform:uppercase; color:rgba(255,179,193,.85); font-weight:bold;}
    .leather h1{ margin:0; color:var(--gold); font-size:clamp(2.5rem, 6vw, 3.8rem); letter-spacing:.06em; line-height:1.15; text-shadow:0 2px 2px rgba(0,0,0,.85), 0 -1px 0 rgba(255,255,255,.12); }
    .leather .orn{ color:rgba(255,179,193,.9); font-size:1.6rem; }
    .leather .sub{ font-size:1.2rem; color:#ffc2d1; letter-spacing:.08em; }
    .leather .hint{ font-family:var(--mono); font-size:0.9rem; color:rgba(255,179,193,.65); margin-top:8px; }

    .endpaper{ position:absolute; inset:0; background: repeating-radial-gradient(circle at 28% 38%, transparent 0 7px, rgba(201,24,74,.05) 7px 8px), repeating-radial-gradient(circle at 72% 64%, transparent 0 9px, rgba(255,143,163,.10) 9px 10px), radial-gradient(42% 34% at 22% 24%, rgba(201,24,74,.25), transparent 70%), radial-gradient(50% 40% at 76% 30%, rgba(255,179,193,.30), transparent 70%), radial-gradient(46% 42% at 34% 78%, rgba(164,19,60,.25), transparent 70%), radial-gradient(52% 44% at 82% 82%, rgba(255,117,143,.20), transparent 70%), var(--paper-2); display:flex; align-items:center; justify-content:center; }
    .bookplate{ background:var(--paper-1); border:2px solid var(--line); box-shadow:0 4px 15px rgba(201,24,74,.25); padding:20px 30px; text-align:center; max-width:75%; }
    .bookplate .over{ font-size:0.8rem; letter-spacing:.3em; text-transform:uppercase; color:var(--brass-d); font-weight:bold;}
    .bookplate .name{ font-size:1.4rem; margin-top:8px; color:var(--oxblood-d); font-weight:bold; }
    .bookplate .yr{ font-family:var(--mono); font-size:0.9rem; color:var(--ink-soft); margin-top:10px; font-weight:bold;}

    .colophon{ align-items:center; text-align:center; justify-content:center; gap:12px; }
    .colophon .big{ font-size:3rem; color:var(--oxblood); }

    .field{ margin:0 0 16px; }
    .field > label{ display:block; font-size:1rem; margin:0 0 6px; color:var(--ink); font-weight:bold;}
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .input, select.input, textarea.input{ width:100%; font-family:var(--serif); font-size:1.1rem; color:var(--ink); background:rgba(255,255,255,.6); border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px; outline:none; transition:border-color .15s, box-shadow .15s, background .15s; }
    textarea.input{ resize:vertical; min-height:80px; line-height:1.4; }
    select.input{ appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position:calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size:6px 6px, 6px 6px; background-repeat:no-repeat; padding-right:34px; cursor:pointer; }
    .input:focus, select.input:focus, textarea.input:focus{ border-color:var(--brass); background:rgba(255,255,255,.9); box-shadow:0 0 0 4px rgba(255,143,163,.25); }

    .choices{ display:flex; gap:16px; flex-wrap:wrap; }
    .choice{ display:inline-flex; align-items:center; gap:8px; font-size:1rem; cursor:pointer; }
    .choice input{ accent-color:var(--oxblood); width:18px; height:18px; }

    .btn{ font-family:var(--serif); font-size:1.1rem; letter-spacing:.02em; padding:12px 20px; border-radius:var(--radius); cursor:pointer; border:1.5px solid var(--oxblood-d); background:linear-gradient(180deg, #d1305c, var(--oxblood)); color:#fff0f5; transition:transform .08s, filter .15s, box-shadow .15s; box-shadow:0 3px 0 var(--oxblood-d); font-weight:bold;}
    .btn:hover{ filter:brightness(1.08); }
    .btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--oxblood-d); }
    .btn.ghost{ background:transparent; color:var(--oxblood-d); border-color:var(--line); box-shadow:0 3px 0 var(--line-soft); }
    .btn.ghost:active{ box-shadow:0 0 0 var(--line-soft); }
    .btn.brass{ background:transparent; color:var(--gold); border:1.5px solid rgba(255,179,193,.6); box-shadow:0 3px 0 rgba(0,0,0,.4); margin-top:12px; font-size:1.2rem;}
    .btn.brass:hover{ background:rgba(255,179,193,.2); filter:none; }
    .btn.olive{ background:linear-gradient(180deg,#ff8fa3,var(--brass-d)); border-color:#e0647a; box-shadow:0 4px 0 #e0647a; color:#590d22; font-size:1.2rem; text-transform:uppercase;}
    .actions{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:8px; }
    .flash{ font-size:0.95rem; color:var(--oxblood); font-family:var(--mono); opacity:0; transition:opacity .2s; font-weight:bold;}
    .flash.on{ opacity:1; }

    .meter{ margin-top:20px; height: 120px; display: flex; flex-direction: column; justify-content: flex-end; }
    .meter .bars{ display:flex; align-items:flex-end; gap:8px; height:90px; padding:10px 0; }
    .meter .bar{ flex:1; background:linear-gradient(180deg, var(--brass), var(--brass-d)); border-radius:3px 3px 0 0; transition: height 0.3s ease-out; }

    .collage { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; perspective: 1000px; padding-top: 15px; }
    .polaroid { width: 90%; aspect-ratio: 3/4; cursor: pointer; }
    .polaroid:nth-child(1) { transform: rotate(-3deg); }
    .polaroid:nth-child(2) { transform: rotate(4deg); }
    .polaroid:nth-child(3) { transform: rotate(-2deg); }
    .polaroid:nth-child(4) { transform: rotate(5deg); }
    .p-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .polaroid.flipped .p-inner { transform: rotateY(180deg) scale(1.05); }
    .p-front, .p-back { position: absolute; inset:0; backface-visibility: hidden; background: #fff; padding: 12px; box-shadow: 0 5px 10px rgba(0,0,0,0.15); border-radius: 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border: 1px solid #ffccd5; }
    .p-back { transform: rotateY(180deg); background: #fff5f7; color: var(--ink); font-size: 1rem; padding: 15px; font-style: italic; border: 1.5px dashed var(--brass); }
    
    .img-ph { width: 100%; flex: 1; object-fit: cover; border-radius: 3px; border: 1px solid #ffccd5; background: #ffe4e8; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .p-caption { font-family: var(--mono); font-size: 0.85rem; margin-top: 10px; color: var(--oxblood-d); font-weight: bold; }

    .big-heart { font-size: 5.5rem; cursor: pointer; user-select: none; transition: transform 0.1s; display:inline-block; filter: drop-shadow(0 6px 8px rgba(201,24,74,0.4)); margin: 10px 0;}
    .big-heart:active { transform: scale(0.9); }
    .heart-msg { font-size: 1.2rem; color: var(--oxblood); font-weight: bold; margin-top: 15px; height: 1.2em; }

    .coupon-box { border: 2.5px dashed var(--oxblood); background: #fff5f7; border-radius: 10px; padding: 25px; text-align: center; min-height: 130px; display:flex; align-items:center; justify-content:center; margin: 25px 0; font-weight: bold; color: var(--oxblood-d); font-size: 1.4rem; line-height: 1.4; box-shadow: inset 0 0 15px rgba(201,24,74,0.1); }
    @keyframes pop { 0% { transform: scale(0.6); opacity:0; } 70% { transform: scale(1.1); opacity:1; } 100% { transform: scale(1); opacity:1; } }

    .pager{ display:flex; align-items:center; gap:20px; color:#ffccd5; margin-top:40px; position:relative; z-index:5; }
    .navbtn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:var(--serif); font-size:1.1rem; padding:12px 20px; border-radius:8px; cursor:pointer; background:rgba(255,179,193,.15); color:#ffe4e8; border:1px solid rgba(255,179,193,.28); transition:background .15s, transform .08s; font-weight:bold;}
    .navbtn:hover:not(:disabled){ background:rgba(255,179,193,.3); }
    .navbtn:active:not(:disabled){ transform:translateY(2px); }
    .navbtn:disabled{ opacity:.4; cursor:not-allowed; }
    .pager .pos{ font-family:var(--mono); font-size:1rem; letter-spacing:.08em; color:#ffb3c1; min-width:20ch; text-align:center; }

    @media (max-width:560px){ .row2{ grid-template-columns:1fr; } .warp{ aspect-ratio:3 / 4; max-height:68dvh; } }
    @media (prefers-reduced-motion:reduce){ .paper, .book, .edge, .face::after{ transition-duration:.001ms; transition-delay:0s; } }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="book-curve" x="-4%" y="-8%" width="108%" height="118%" color-interpolation-filters="sRGB">
    <feImage id="curve-map" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
    <feGaussianBlur id="soft" in="warped" stdDeviation="0"/>
  </filter>
</svg>

<div class="toolbar">
  <span class="brand"><b>Un Pedacito de recuerdos</b> · Feliz Aniversario</span>
  <div class="controls">
    <div class="ctl">
      <label for="depthL">Curva izquierda</label>
      <input type="range" id="depthL" class="range" min="0" max="36" value="0" step="1">
      <span class="val" id="depthValL">0px</span>
    </div>
    <div class="ctl">
      <label for="depthR">Curva derecha</label>
      <input type="range" id="depthR" class="range" min="0" max="36" value="16" step="1">
      <span class="val" id="depthValR">16px</span>
    </div>
  </div>
</div>

<div class="stage">
  <div class="warp curved" id="warp">
    <div class="book closed-front" id="book">
      <div class="edge l"></div>
      <div class="edge r"></div>
      <div id="leaves"></div>
      <div class="spine3d" aria-hidden="true">
        <div class="sface"><span class="stitle">Nuestro Amor · Siempre</span></div>
        <div class="sface rev"><span class="stitle">Nuestro Amor · Siempre</span></div>
      </div>
      <div class="gutter"></div>
    </div>
  </div>
</div>

<div class="pager">
  <button class="navbtn" id="prev" disabled>‹ Anterior</button>
  <span class="pos" id="pos">Cerrado · portada</span>
  <button class="navbtn" id="next">Siguiente ›</button>
</div>

<script>
window.generarVale = function() {
  const coupons = [
    "Vale por una salida al cine juntos 🍿🎬",
    "Vale por una cena romántica 🍝🍷",
    "Vale por una tarde de pelis🍕📺",
    "Vale por 100 besos💋",
    "Vale por un cambio por lo que tu quieras🧡",
    "Vale por Un Cafecito por la mañana☕",
    "Vale En Blanco para lo que quieras🧡",
  ];
  const box = document.getElementById('couponBox');
  if (box) {
    const randomCoupon = coupons[Math.floor(Math.random() * coupons.length)];
    box.innerHTML = '';
    setTimeout(() => {
      box.innerHTML = '<span style="animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: inline-block;">' + randomCoupon + '</span>';
    }, 10);
  }
};

document.addEventListener('keydown', function(e) {
  if (e.target.closest('input, textarea')) return; 
  
  if (e.key === 'v' || e.key === 'V' || e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); 
    window.generarVale();
  }
});

window.loveLevel = 10;
window.llenarCorazon = function() {
  window.loveLevel += 15;
  if (window.loveLevel > 100) window.loveLevel = 100;
  
  const bars = document.querySelectorAll('#loveBars .bar');
  bars.forEach(b => {
    let h = Math.random() * 20 + (window.loveLevel - 20);
    if (h < 5) h = 5; if (h > 100) h = 100;
    b.style.height = h + '%';
  });

  const msg = document.getElementById('heartMsg');
  const btn = document.getElementById('heartBtn');
  if (window.loveLevel >= 100) {
    msg.textContent = "¡Mi corazón está desbordado! 💖";
    btn.style.transform = "scale(1.2)";
    setTimeout(() => btn.style.transform = "scale(1)", 200);
  } else if (window.loveLevel >= 50) {
    msg.textContent = "¡Casi lleno de amor! 😍";
  } else {
    msg.textContent = "¡Sigue tocando! 💕";
  }
};


const frontCover = `
  <div class="leather">

const leavesEl = document.getElementById('leaves');
const papers = [];

leaves.forEach((L, i) => {
  const p = document.createElement('div');
  p.className = 'paper' + (L.cls ? ' ' + L.cls : '');
  p.style.setProperty('--tz', (-(i) * 0.6) + 'px'); 
  p.innerHTML =
    `<div class="face front">${L.f}<span class="corner next" data-dir="next"></span></div>` +
    `<div class="face back">${L.b}<span class="corner prev" data-dir="prev"></span></div>`;

  papers.push(p);

const N = papers.length;      
const M = N - 2;              
let current = 0;              
let animating = false;

const positions = [ 'Cerrado · portada', 'Inicio · Nuestro amor', 'Páginas 1 – 2', 'Páginas 3 – 4', 'Epílogo', 'Cerrado · contraportada' ];
const bookEl  = document.getElementById('book');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const posEl   = document.getElementById('pos');
let prevClosed = true; 

function applyState(){
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === N;
  posEl.textContent = positions[current] || `Página ${current}`;
  const nowClosed = current === 0 || current === N;
  bookEl.classList.toggle('closed-front', current === 0);
  bookEl.classList.toggle('closed-back',  current === N);
  bookEl.classList.toggle('is-closed',    nowClosed);
  const T = 24;
  const flippedInner = Math.min(Math.max(current - 1, 0), M);
  bookEl.style.setProperty('--tL', (flippedInner / M * T).toFixed(1) + 'px');
  bookEl.style.setProperty('--tR', ((M - flippedInner) / M * T).toFixed(1) + 'px');
  syncCurve(prevClosed && !nowClosed); 
  prevClosed = nowClosed;
}

function flip(dir){
  if (animating) return;
  if (dir === 'next' && current < N){
    const p = papers[current];
    p.classList.add('turning', 'flipped');
    current++;
    settle(p);
  } else if (dir === 'prev' && current > 0){
    current--;
    const p = papers[current];
    p.classList.add('turning');
    p.classList.remove('flipped');
    settle(p);
  }
  applyState();
}

function settle(p){
  animating = true;
  const done = () => { p.classList.remove('turning'); animating = false; };
  p.addEventListener('transitionend', done, { once:true });
  setTimeout(done, 980); 
}

prevBtn.addEventListener('click', () => flip('prev'));
nextBtn.addEventListener('click', () => flip('next'));
leavesEl.addEventListener('click', e => { const c = e.target.closest('.corner'); if (c) flip(c.dataset.dir); });
document.addEventListener('keydown', e => { if (e.target.closest('input, select, textarea')) return; if (e.key === 'ArrowRight') flip('next'); if (e.key === 'ArrowLeft') flip('prev'); });

const REG = { x:0.04, w:1.08, y:0.08, h:1.18 };   
const HALF = 0.5 - REG.x / REG.w;                 
const gyA = [ [0.000,0],[0.068,0],[0.280,.38],[0.490,.55],[0.700,.38],[0.915,.15],[1.000,.12] ];
let dL = 0, dR = 16;                 
let gxLUT = [[0,128],[1,128]];       

function prof(t){ if (t >= 1) return 0; const base = Math.pow(1 - t, 2.2); const round = 0.04 * Math.pow(Math.max(0, 1 - t / 0.06), 2); return Math.max(0, base - round); }
function well(t, Dmax){ const w = Math.max(0, 1 - t / 0.14); return 0.96 * Dmax * w * w; }
function lerpStops(stops, t){ if (t <= stops[0][0]) return stops[0][1]; for (let i = 1; i < stops.length; i++){ if (t <= stops[i][0]){ const [a, va] = stops[i-1], [b, vb] = stops[i]; return va + (vb - va) * (t - a) / (b - a); } } return stops[stops.length - 1][1]; }

const mapImg = document.getElementById('curve-map');
function rebuildMap(){
  const Dmax = Math.max(dL, dR);
  const steps = 160;
  gxLUT = [];
  let stops = '';
  for (let i = 0; i <= steps; i++){
    const u = i / steps; let g = 128;
    if (Dmax > 0){ const t = Math.min(1, Math.abs(u - 0.5) / HALF); const d = u <= 0.5 ? dL : dR; const disp = Math.max(d * prof(t), well(t, Dmax)); g = Math.round(128 - 127 * disp / Dmax); }
    gxLUT.push([u, g]);
    stops += `<stop offset="${u.toFixed(5)}" stop-color="rgb(128,${g},128)"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600"><defs><linearGradient id="gx" x1="0" y1="0" x2="1" y2="0">${stops}</linearGradient><linearGradient id="gy" x1="0" y1="0" x2="0" y2="1">` + gyA.map(([o,a]) => `<stop offset="${o}" stop-color="rgb(128,128,128)" stop-opacity="${a}"/>`).join('') + `</linearGradient></defs><rect width="1200" height="600" fill="url(#gx)"/><rect width="1200" height="600" fill="url(#gy)"/></svg>`;
  const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  mapImg.setAttribute('href', uri); mapImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', uri);
}

let mapDirty = false;
function requestMap(){ if (mapDirty) return; mapDirty = true; requestAnimationFrame(() => { mapDirty = false; rebuildMap(); }); }

const warp = document.getElementById('warp'), depthL = document.getElementById('depthL'), depthR = document.getElementById('depthR'), depthValL = document.getElementById('depthValL'), depthValR = document.getElementById('depthValR'), disp = document.getElementById('disp'), soft = document.getElementById('soft');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let scale = 0, raf = null, curveTimer = null;

function setScale(s){ scale = s; disp.setAttribute('scale', s.toFixed(2)); soft.setAttribute('stdDeviation', Math.min(0.35, s * 0.013).toFixed(3)); }
function tweenTo(to, after){ cancelAnimationFrame(raf); if (RM){ setScale(to); if (after) after(); return; } const step = () => { const d = to - scale; if (Math.abs(d) < 0.15){ setScale(to); if (after) after(); return; } setScale(scale + d * 0.14); raf = requestAnimationFrame(step); }; step(); }
function syncCurve(justOpened){ clearTimeout(curveTimer); const Dmax = Math.max(dL, dR); const closed = current === 0 || current === N; const goal = (closed || Dmax === 0) ? 0 : 2 * Dmax; if (goal === 0){ tweenTo(0, () => { if (Math.max(dL, dR) === 0) warp.classList.remove('curved'); }); return; } warp.classList.add('curved'); if (justOpened && !RM){ curveTimer = setTimeout(() => tweenTo(goal), 900); } else { tweenTo(goal); } }
function onDepthInput(){ dL = parseFloat(depthL.value); dR = parseFloat(depthR.value); depthValL.textContent = depthL.value + 'px'; depthValR.textContent = depthR.value + 'px'; requestMap(); syncCurve(false); }
depthL.addEventListener('input', onDepthInput); depthR.addEventListener('input', onDepthInput);
rebuildMap(); applyState();

function srcPoint(cx, cy){ const r = warp.getBoundingClientRect(); if (cx < r.left || cx > r.right || cy < r.top || cy > r.bottom + 40) return null; const u = ((cx - r.left) / r.width  + REG.x) / REG.w; const v = ((cy - r.top)  / r.height + REG.y) / REG.h; const g = lerpStops(gxLUT, u); const a = lerpStops(gyA, v); const eff = g * (1 - a) + 128 * a; const dy = scale * (eff / 255 - 0.5); if (Math.abs(dy) < 2) return null; return [cx, cy + dy]; }
function correctedTarget(e){ if (!e.isTrusted || scale < 0.5) return null; const p = srcPoint(e.clientX, e.clientY); if (!p) return null; const el = document.elementFromPoint(p[0], Math.max(0, Math.min(p[1], innerHeight - 1))); if (!el || !warp.contains(el)) return null; if (el === e.target || el.contains(e.target) || e.target.contains(el)) return null; return el; }

document.addEventListener('pointerdown', e => { const t = correctedTarget(e); if (!t) return; e.preventDefault(); const ctl = t.closest('input, select, textarea'); if (!ctl) return; if (ctl.matches('input[type=range]')){ startRangeDrag(ctl, e); } else { ctl.focus({ preventScroll:true }); } }, true);
document.addEventListener('click', e => { const t = correctedTarget(e); if (!t) return; e.preventDefault(); e.stopPropagation(); activate(t); }, true);

function activate(t){
  const ctl = t.closest('button, [data-flip-next], label, input, select, textarea, .corner, tr, .pagebtn, .miniswitch') || t;
  if (ctl.matches('select') || ctl.matches('input[type=date]')){ ctl.focus({ preventScroll:true }); try { ctl.showPicker(); } catch(_){} return; }
  if (ctl.matches('input[type=text], textarea')){ ctl.focus({ preventScroll:true }); return; }
  if (ctl.hasAttribute('onclick')) { return ctl.click(); }
  if (typeof ctl.click === 'function') ctl.click(); else ctl.dispatchEvent(new MouseEvent('click', { bubbles:true }));
}

function startRangeDrag(r, e0){ const rect = r.getBoundingClientRect(); const set = ev => { const min = +r.min || 0, max = +r.max || 100, step = +r.step || 1; let f = (ev.clientX - rect.left) / rect.width; f = Math.max(0, Math.min(1, f)); let v = min + f * (max - min); v = Math.round(v / step) * step; if (String(v) !== r.value){ r.value = v; r.dispatchEvent(new Event('input', { bubbles:true })); } }; set(e0); const mv = ev => set(ev); const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); r.dispatchEvent(new Event('change', { bubbles:true })); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); }

document.addEventListener('click', e => {
  if (e.target.matches('[data-flip-next]')){ flip('next'); return; }
  if (e.target.matches('[data-save]')){ const flash = e.target.closest('.actions')?.querySelector('[data-flash]'); if (flash){ flash.classList.add('on'); setTimeout(() => flash.classList.remove('on'), 1600); } }
});
